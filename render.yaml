# Render.com Blueprint for Aegis-Manim Render Backend
# Usage: Connect your GitHub repo to Render and select "New Blueprint"
services:
  - type: web
    name: aegis-manim-render
    runtime: docker
    repo: https://github.com/yishu-ziyu/Aegis-Manim
    branch: main
    rootDir: render_backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: MANIM_API_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: manim-videos
      - key: MANIM_EXECUTOR
        value: local
      - key: MANIM_RENDER_TIMEOUT_SECONDS
        value: 300
      - key: MANIM_SEGMENT_RENDER_THRESHOLD
        value: 2
      - key: MANIM_SEGMENT_RENDER_SIZE
        value: 2
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 10
    healthCheckPath: /health
    autoDeploy: true
